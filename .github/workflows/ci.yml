name: ContextFlow CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contextflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.11 deterministic suite and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pip-audit==2.9.0
      - name: Check dependency integrity
        run: python -m pip check
      - name: Scan Python dependencies
        run: python -m pip_audit -r backend/requirements.txt --strict
      - name: Run deterministic backend contracts
        env:
          PYTHON_BIN: python
          SKIP_FRONTEND: "1"
        run: ./run_tests.sh

  frontend:
    name: Frontend lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Scan production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Scan all dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint with zero warnings
        working-directory: frontend
        run: npm run lint
      - name: Build production application
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://offline.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: unused
          NEXT_PUBLIC_MVP_USER_ID: 123e4567-e89b-12d3-a456-426614174000
          SUPABASE_SERVICE_KEY: unused
        run: npm run build

  design-system:
    name: Design-system keyboard, responsive, and visual checks
    runs-on: macos-14
    needs: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run design-system acceptance checks
        working-directory: frontend
        run: npm run test:design-system

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
